name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # TypeScript sources are not covered by ESLint (typescript-eslint does not
      # support TS 7 yet), so tsc is what actually gates type errors. See #79.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Run `node --test` directly (not `npm test`) so we don't rebuild:
      # `npm test` is `npm run build && node --test`, and the Build step above
      # already produced `dist/`. Rebuilding here would just double the work and
      # obscure whether a failure came from the build or from the tests.
      - name: Test
        run: node --test
